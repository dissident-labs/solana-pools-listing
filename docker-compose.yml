version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: solana_hack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: solana_hackathon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solana_hackathon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: